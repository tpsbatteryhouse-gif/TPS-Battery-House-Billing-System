<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M4 7h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm18 3h1a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-1v-4zM6 10v4h2v-4H6zm4 0v4h5v-4h-5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPS BATTERYS HOUSE - GST Billing & Tax Invoice Generator</title>
    <meta name="description" content="Professional GST Tax Invoice & Billing Application for TPS BATTERYS HOUSE, Padinarangadi, Kerala." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-white min-h-screen">
    <div id="root">
      <!-- Pre-mount loading shell styled to match TPS Battery House dark theme -->
      <div id="pre-mount-fallback" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="text-align: center; max-width: 380px; padding: 24px;">
          <div style="width: 56px; height: 56px; margin: 0 auto 16px; background-color: #f59e0b; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3);">
            <svg style="width: 32px; height: 32px; fill: none; stroke: #020617; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
              <path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2" />
              <path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1" />
              <line x1="11" y1="7" x2="11" y2="17" />
              <line x1="7" y1="11" x2="15" y2="11" />
            </svg>
          </div>
          <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 6px; letter-spacing: -0.02em;">TPS BATTERYS HOUSE</h2>
          <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading GST Billing System...</p>
        </div>
      </div>
    </div>

    <!-- Script to catch any catastrophic top-level module errors before React mounts -->
    <script>
      window.addEventListener('error', function(e) {
        var preMount = document.getElementById('pre-mount-fallback');
        if (preMount) {
          preMount.innerHTML = `
            <div style="text-align: center; max-width: 440px; padding: 24px; background: #0f172a; border: 1px solid #334155; border-radius: 20px;">
              <div style="width: 50px; height: 50px; margin: 0 auto 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 24px; font-weight: bold;">!</div>
              <h3 style="font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 8px;">Initialization Issue</h3>
              <p style="font-size: 12.5px; color: #cbd5e1; margin-bottom: 12px; font-family: monospace; background: #020617; padding: 8px 12px; border-radius: 8px; word-break: break-all;">` + (e.message || 'Error loading application modules') + `</p>
              <button onclick="window.location.reload()" style="background: #f59e0b; color: #020617; font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;">Reload Application</button>
            </div>
          `;
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
